schema: spec-driven

context: |
  # Cnert
  A small library for creating TLS private keys, CSRs, private CAs and
  certificates, for use as test fixtures. Published on PyPI; consumers
  are other projects' test suites, so the public API is a contract.
  All source is one module: `src/cnert/__init__.py` (~900 lines).

  ## Tech
  Python >= 3.12 (CI matrix 3.12/3.13/3.14) · cryptography · idna · uv ·
  ruff · ty (type gate) · pytest + coverage · mkdocs-material +
  mkdocstrings · GitHub Actions · Task (taskfile.yaml).

  ## Architecture (src/cnert/__init__.py)
  - build_private_key / idna_encode / identity_string_to_x509 — module
    helpers.
  - Freezer + NameAttrs — frozen attribute holder for X.509 name
    attributes (subject/issuer DN kwargs).
  - _CertBuilder — assembles x509.CertificateBuilder: key usage, basic
    constraints, SAN, subject/authority key identifier; signs.
  - Cert — a certificate plus its key; PEM/PKCS1/PKCS8 accessors,
    MD5/SHA1/SHA256 fingerprints, key identifier digests.
  - CSR — certificate signing request plus its key.
  - CA — root or intermediate authority; issue_intermediate(),
    issue_cert().
  - Tests live in tests/cnert/test_cnert.py; docs in docs/ (cnert.md is
    the API reference, generated by mkdocstrings).

  ## Commands
  task test [-- pytest args] · task lint (ruff format --diff + check) ·
  task typing (uvx ty check) · task check (lint + typing, the CI gate) ·
  task cov · task docs:test · task release -- patch|minor|major.

  ## Hard constraints
  - Single-module layout: keep the public API in src/cnert/__init__.py
    unless a change proposal argues for splitting it.
  - Public names (Cert, CSR, CA, NameAttrs, build_private_key, and
    their attributes) are downstream API; removals and renames are
    breaking and need a major bump.
  - `__version__` comes from installed package metadata — never
    hardcode it; `[project].version` in pyproject.toml is the source of
    truth.
  - ruff format + check clean, 79-col lines including comments and
    docstrings; `task typing` clean.
  - Release order: bump, commit, tag — see docs/releasing.md.

rules:
  specs:
    - Specs describe current behaviour only; planned work stays in
      changes/ deltas until synced/archived.
    - Wrap markdown at 79 cols; kebab-case capability dirs; every
      requirement carries at least one WHEN/THEN scenario.
    - Cross-reference sibling capabilities by name instead of
      restating their rules.
  proposal:
    - State public-API impact explicitly; default to
      backwards-compatible, keyword-argument-only additions.
    - Say which cryptography APIs a change depends on and the minimum
      version that provides them.
  tasks:
    - Max ~2h chunks; include file paths.
    - Every chunk ends green under `task check` and `task test`.
    - New or changed public behaviour ships with tests in
      tests/cnert/test_cnert.py and docstrings that mkdocstrings can
      render.
